
name: Build AL-HADITHI APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'AlHadithi_v1.0.8_ContinuousReader.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

            - name: Install Android SDK
        run: |
          sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Extract project
        run: |
          mkdir source
          unzip -q AlHadithi_v1.0.8_ContinuousReader.zip -d source

      - name: Build APK
        working-directory: source
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AL-HADITHI-v1.0.8-APK
          path: source/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
